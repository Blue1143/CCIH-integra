name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccih_owner
          POSTGRES_DB: ccih_test
          # Ephemeral container reachable only inside this job: no password is versioned.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ccih_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_OWNER_URL: postgres://ccih_owner@localhost:5432/ccih_test
      TEST_DATABASE_URL: postgres://ccih_app@localhost:5432/ccih_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Papel de aplicação com privilégio mínimo
        run: |
          psql -h localhost -U ccih_owner -d ccih_test -c "CREATE ROLE ccih_app LOGIN"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_DATA_SOURCE: api

  e2e:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccih_owner
          POSTGRES_DB: ccih_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ccih_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_OWNER_URL: postgres://ccih_owner@localhost:5432/ccih_e2e
      DATABASE_URL: postgres://ccih_app@localhost:5432/ccih_e2e
      APP_ORIGIN: http://localhost:5173
      COOKIE_SECURE: 'false'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Papel de aplicação com privilégio mínimo
        run: psql -h localhost -U ccih_owner -d ccih_e2e -c "CREATE ROLE ccih_app LOGIN"
      - name: Senha aleatória dos usuários sintéticos (gerada por execução, mascarada)
        run: |
          pw="E2e-$(openssl rand -hex 12)-Aa1!"
          echo "::add-mask::$pw"
          echo "SEED_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
        env:
          VITE_DATA_SOURCE: api
      - run: npx playwright install --with-deps chromium
      - run: npm run db:reset -w @ccih/api
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Publicação: constrói as imagens, sobe banco + migração + API + proxy e confere prontidão e web.
  publicacao:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Segredos efêmeros (gerados por execução, nunca versionados)
        run: |
          {
            echo "SITE_ADDRESS=http://localhost"
            echo "APP_ORIGIN=http://localhost"
            echo "DB_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "DB_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "ATTACHMENT_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "ATTACHMENT_ENCRYPTION_KEY_ID=ci"
          } > .env
      - run: docker compose up -d --build
      - name: Prontidão da API (banco e migrações em dia)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/ready; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Web servida pelo proxy, com rotas da aplicação e cabeçalhos de segurança
        run: |
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS http://localhost/consultoria/contratos | grep -q '<div id="root">'
          curl -fsSI http://localhost/ | grep -qi '^x-frame-options: DENY'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/consulting/contracts)" = "401"
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -n 300

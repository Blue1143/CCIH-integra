# CCIH Integra — publicação com Docker Compose (um servidor): banco, migração, API e proxy HTTPS.
# Preencha deploy/.env a partir de deploy/.env.example (nunca versione o .env) e rode, nesta pasta:
#   docker compose up -d --build
# Antivírus opcional: docker compose --profile antivirus up -d --build (com ANTIVIRUS=clamav no .env).
name: ccih-integra

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: "postgres://ccih_app:${DB_APP_PASSWORD:?defina DB_APP_PASSWORD}@db:5432/ccih"
  DATABASE_OWNER_URL: "postgres://ccih_owner:${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD}@db:5432/ccih"
  APP_ORIGIN: "${APP_ORIGIN:?defina APP_ORIGIN (ex.: https://ccih.exemplo.com.br)}"
  COOKIE_SECURE: "true"
  TRUST_PROXY: "true"
  ATTACHMENT_STORAGE: "${ATTACHMENT_STORAGE:-local}"
  ATTACHMENT_ENCRYPTION_KEY: "${ATTACHMENT_ENCRYPTION_KEY:?defina ATTACHMENT_ENCRYPTION_KEY}"
  ATTACHMENT_ENCRYPTION_KEY_ID: "${ATTACHMENT_ENCRYPTION_KEY_ID:-k1}"
  ATTACHMENT_ENCRYPTION_PREVIOUS_KEYS: "${ATTACHMENT_ENCRYPTION_PREVIOUS_KEYS:-}"
  FIELD_ENCRYPTION_KEY: "${FIELD_ENCRYPTION_KEY:-}"
  S3_ENDPOINT: "${S3_ENDPOINT:-}"
  S3_REGION: "${S3_REGION:-}"
  S3_BUCKET: "${S3_BUCKET:-}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
  S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
  ANTIVIRUS: "${ANTIVIRUS:-off}"
  CLAMAV_HOST: clamav
  SESSION_IDLE_MINUTES: "${SESSION_IDLE_MINUTES:-30}"
  LOGIN_MAX_ATTEMPTS: "${LOGIN_MAX_ATTEMPTS:-5}"
  PASSWORD_MAX_AGE_DAYS: "${PASSWORD_MAX_AGE_DAYS:-0}"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccih
      POSTGRES_USER: ccih_owner
      POSTGRES_PASSWORD: "${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD}"
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:?defina DB_APP_PASSWORD}"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccih_owner -d ccih"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sem porta publicada: o banco só é acessível pela rede interna dos containers.

  # Aplica as migrações pendentes e as permissões do papel da aplicação a cada subida; termina em seguida.
  migrate:
    build: { context: .., target: api }
    image: ccih-integra-api:local
    command: ["node", "dist/cli.js", "migrate"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., target: api }
    image: ccih-integra-api:local
    restart: unless-stopped
    environment: *api-env
    volumes:
      - uploads:/app/apps/api/var
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: .., target: web }
    image: ccih-integra-web:local
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?defina SITE_ADDRESS (ex.: ccih.exemplo.com.br)}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles: ["antivirus"]
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
  clamav-db:
